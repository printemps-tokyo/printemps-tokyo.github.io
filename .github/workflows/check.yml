name: Check

# Reports when data/repos.json or data/releases.json has fallen behind GitHub
# (a new public repository, or a new release). It only checks: updating the
# data and the pages stays a reviewed commit.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node build.mjs --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
